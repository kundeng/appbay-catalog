name: bolt
description: AI-powered full-stack web app builder in the browser
version: latest
category: devtools
tags: [ai, coding, web-development, no-code]
source:
  type: git
  url: https://github.com/stackblitz-labs/bolt.diy
  ref: main
readiness: augmented
required_inputs:
  - name: BOLT_HOST
    description: Hostname for Bolt
    type: string
    default: "bolt.${{project.DOMAIN}}"
  - name: OPENAI_API_KEY
    description: OpenAI API key (optional)
    type: secret
    default: ""
traits_summary:
  - "ingress: internal HTTPS on port 5173"
  - "auth: Authelia forward-auth"
  - "overlays: auto-wires Ollama + LiteLLM"
  - "stateless — no backup needed"
maintainer: appbay
