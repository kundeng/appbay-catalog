project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - notifiarr

vars:
  NOTIFIARR_HOST:
    description: Hostname for notifiarr
    type: string
    default: "notifiarr.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "notifiarr.${{project.DOMAIN}}"
    port: 5454
    service: notifiarr
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: notifiarr
