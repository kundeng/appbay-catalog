project: default
environment: default
collection: [media]
tags:
  tier: app
  role: movie-management

upstream:
  source: ./docker-compose.yml
  expose:
    - radarr

vars:
  RADARR_HOST:
    description: Hostname for Radarr
    type: string
    default: "radarr.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "radarr.${{project.DOMAIN}}"
    port: 7878
    service: radarr
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: radarr
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - radarr-config
