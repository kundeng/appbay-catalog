project: default
environment: default
collection: [media]
tags:
  tier: app
  role: torrent-downloader

upstream:
  source: ./docker-compose.yml

vars:
  DOWNLOADS_DIR:
    description: Host path for downloads
    type: path
    default: /data/downloads
  TZ:
    description: Timezone
    type: string
    default: Etc/UTC

traits:
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - qbittorrent-config
