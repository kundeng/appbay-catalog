project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: llm-workflow-builder

upstream:
  source: ./docker-compose.yml
  expose:
    - langflow

vars:
  LANGFLOW_HOST:
    description: Hostname for Langflow
    type: string
    default: "langflow.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "langflow.${{project.DOMAIN}}"
    port: 7860
    service: langflow
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: langflow
  - type: secrets
    provider: vault
    refs:
      LANGFLOW_SUPERUSER_PASSWORD: vault://langflow/LANGFLOW_SUPERUSER_PASSWORD?gen=password:24
      LANGFLOW_SECRET_KEY: vault://langflow/LANGFLOW_SECRET_KEY?gen=password:32
    injection: runtime-env
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - langflow_data

overlays:
  - when: [ollama]
    services:
      langflow:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
  - when: [litellm]
    services:
      langflow:
        environment:
          - OPENAI_API_BASE=http://litellm_litellm:4000/v1
