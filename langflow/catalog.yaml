name: langflow
description: Visual LLM workflow builder with LangChain integration
version: latest
category: ai
tags: [ai, llm, workflow, langchain, no-code]
source:
  type: git
  url: https://github.com/langflow-ai/langflow
  ref: main
readiness: augmented
required_inputs:
  - name: LANGFLOW_HOST
    description: Hostname for Langflow
    type: string
    default: "langflow.${{project.DOMAIN}}"
traits_summary:
  - "ingress: external HTTPS on port 7860"
  - "auth: Authelia forward-auth"
  - "backup: daily (flow data)"
  - "overlays: auto-wires Ollama"
maintainer: appbay
