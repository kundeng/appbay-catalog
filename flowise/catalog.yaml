name: flowise
description: Visual LLM workflow builder with drag-and-drop chains and agents
version: latest
category: ai
tags: [ai, llm, workflow, no-code, langchain]
source:
  type: git
  url: https://github.com/FlowiseAI/Flowise
  ref: main
readiness: augmented
required_inputs:
  - name: FLOWISE_HOST
    description: Hostname for the Flowise web UI
    type: string
    default: "flowise.${{project.DOMAIN}}"
traits_summary:
  - "ingress: external HTTPS on port 3000"
  - "auth: Authelia forward-auth"
  - "backup: daily, 14-day retention"
  - "overlays: auto-wires Ollama as LLM backend"
  - "no secrets needed"
maintainer: appbay
