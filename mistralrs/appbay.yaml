project: default
environment: default
collection: [ai, self-hosted]
tags:
  tier: infra
  role: inference-server

upstream:
  source: ./docker-compose.yml
  expose:
    - mistralrs

traits:
  - type: ingress
    host: "mistralrs.${{project.DOMAIN}}"
    port: 8021
    service: mistralrs
    exposure: external
    tls:
      staging: false
