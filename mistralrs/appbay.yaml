project: default
environment: default
collection:
- ai
- self-hosted
tags:
  tier: infra
  role: inference-server
upstream:
  source: ./docker-compose.yml
  expose:
  - mistralrs
traits:
- type: ingress
  host: mistralrs.${{project.DOMAIN}}
  port: 8021
  service: mistralrs
  exposure: external
  tls:
    staging: false
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - mistralrs_hf_cache
  - mistralrs_gguf
