traits:
- type: ingress
  service: khoj
  port: 42110
- type: auth
  enabled: true
  provider: authelia
  service: khoj
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - khoj_config
  - khoj_models
  - khoj_db
overlays:
- when:
  - ollama
  services:
    khoj:
      environment:
      - OLLAMA_BASE_URL=http://appbay.ollama:11434
