project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: ai-assistant

upstream:
  source: ./docker-compose.yml
  expose:
    - khoj

vars:
  KHOJ_HOST:
    description: Hostname for Khoj
    type: string
    default: "khoj.${{project.DOMAIN}}"
  KHOJ_DB_PASSWORD:
    description: PostgreSQL password
    type: secret
    auto_generate: true

traits:
  - type: ingress
    host: "khoj.${{project.DOMAIN}}"
    port: 42110
    service: khoj
    exposure: external
    tls:
      staging: false
  - type: auth
    enabled: true
    provider: authelia
    service: khoj
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - khoj_db
      - khoj_config

overlays:
  - when: [ollama]
    services:
      khoj:
        environment:
          - OPENAI_API_BASE=http://appbay.ollama:11434/v1
