project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: ai-assistant

upstream:
  source: ./docker-compose.yml
  expose:
    - khoj

vars:
  KHOJ_HOST:
    description: Hostname for Khoj
    type: string
    default: "khoj.${{project.DOMAIN}}"
  KHOJ_DB_PASSWORD:
    description: PostgreSQL password
    type: secret
    auto_generate: true

traits:
  - type: ingress
    host: "khoj.${{project.DOMAIN}}"
    port: 42110
    service: khoj
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: khoj
  - type: secrets
    provider: vault
    refs:
      KHOJ_DB_PASSWORD: vault://khoj/KHOJ_DB_PASSWORD?gen=password:24
      KHOJ_DJANGO_SECRET_KEY: vault://khoj/KHOJ_DJANGO_SECRET_KEY?gen=password:32
      KHOJ_ADMIN_PASSWORD: vault://khoj/KHOJ_ADMIN_PASSWORD?gen=password:24
    injection: runtime-env
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - khoj_db
      - khoj_config

overlays:
  - when: [ollama]
    services:
      khoj:
        environment:
          - OPENAI_API_BASE=http://appbay.ollama:11434/v1
  - when: [litellm]
    services:
      khoj:
        environment:
          - OPENAI_API_BASE=http://litellm_litellm:4000/v1
