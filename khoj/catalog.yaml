name: khoj
description: AI personal assistant with web search, document chat, and conversation memory
version: latest
category: ai
tags: [ai, assistant, rag, search, self-hosted]
source:
  type: git
  url: https://github.com/khoj-ai/khoj
  ref: master
readiness: augmented
required_inputs:
  - name: KHOJ_HOST
    description: Hostname for Khoj
    type: string
    default: "khoj.${{project.DOMAIN}}"
  - name: KHOJ_DB_PASSWORD
    description: PostgreSQL password
    type: secret
    auto_generate: true
traits_summary:
  - "ingress: external HTTPS on port 42110"
  - "auth: Authelia forward-auth"
  - "secrets: 1 auto-generated (DB)"
  - "backup: daily (postgres + config)"
  - "overlays: auto-wires Ollama"
maintainer: appbay
