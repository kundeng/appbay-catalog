services:
  khoj:
    image: ghcr.io/khoj-ai/khoj:latest
    container_name: khoj
    depends_on:
      khoj-db:
        condition: service_healthy
    ports:
      - ${KHOJ_PORT:-42110}:42110
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - khoj_config:/root/.khoj
      - khoj_models:/root/.cache/torch/sentence_transformers
    environment:
      - POSTGRES_DB=${KHOJ_DB_NAME:-khoj}
      - POSTGRES_USER=${KHOJ_DB_USER:-khoj}
      - POSTGRES_PASSWORD=${KHOJ_DB_PASSWORD:-khoj}
      - POSTGRES_HOST=khoj-db
      - POSTGRES_PORT=5432
      - KHOJ_DJANGO_SECRET_KEY=${KHOJ_DJANGO_SECRET_KEY:-}
      - KHOJ_DEBUG=${KHOJ_DEBUG:-false}
      - KHOJ_ADMIN_EMAIL=${KHOJ_ADMIN_EMAIL:-admin@example.com}
      - KHOJ_ADMIN_PASSWORD=${KHOJ_ADMIN_PASSWORD:-}
      - KHOJ_TELEMETRY_DISABLE=true
    command: --host="0.0.0.0" --port=42110 -vv --anonymous-mode --non-interactive

  khoj-db:
    image: ankane/pgvector:latest
    container_name: khoj-db
    environment:
      - POSTGRES_USER=${KHOJ_DB_USER:-khoj}
      - POSTGRES_PASSWORD=${KHOJ_DB_PASSWORD:-khoj}
      - POSTGRES_DB=${KHOJ_DB_NAME:-khoj}
    volumes:
      - khoj_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KHOJ_DB_USER:-khoj}"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  khoj_config:
  khoj_models:
  khoj_db:
