project: default
environment: default
collection:
- ai
- self-hosted
tags:
  tier: app
  role: research-agent
upstream:
  source: ./docker-compose.yml
  expose:
  - ldr
traits:
- type: ingress
  host: ldr.${{project.DOMAIN}}
  port: 5000
  service: ldr
  exposure: external
  tls:
    staging: false
- type: auth
  enabled: true
  provider: authelia
  service: ldr
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - ldr_config
  - ldr_data
