project: default
environment: default
collection: [ai, self-hosted]
tags:
  tier: app
  role: research-agent

upstream:
  source: ./docker-compose.yml
  expose:
    - ldr

traits:
  - type: ingress
    host: "ldr.${{project.DOMAIN}}"
    port: 5000
    service: ldr
    exposure: internal

overlays:
  - when: [ollama]
    services:
      ldr:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
