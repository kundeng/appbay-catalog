project: default
environment: default
collection:
- ai-stack
tags:
  tier: frontend
  role: chat-ui
upstream:
  source: ./docker-compose.yml
  expose:
  - sillytavern
traits:
- type: ingress
  host: sillytavern.${{project.DOMAIN}}
  port: 8000
  service: sillytavern
  exposure: external
- type: auth
  enabled: true
  provider: authelia
  service: sillytavern
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - sillytavern-config
  - sillytavern-data
  - sillytavern-plugins
  - sillytavern-extensions
overlays:
- when:
  - ollama
  services:
    sillytavern:
      environment:
      - OLLAMA_BASE_URL=http://appbay.ollama:11434
