project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: roleplay-chat

upstream:
  source: ./docker-compose.yml
  expose:
    - sillytavern

vars:
  SILLYTAVERN_HOST:
    description: Hostname for SillyTavern
    type: string
    default: "tavern.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "tavern.${{project.DOMAIN}}"
    port: 8000
    service: sillytavern
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: sillytavern
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - sillytavern-config
      - sillytavern-data

overlays:
  - when: [ollama]
    services:
      sillytavern:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
  - when: [litellm]
    services:
      sillytavern:
        environment:
          - OPENAI_API_BASE=http://litellm_litellm:4000/v1
