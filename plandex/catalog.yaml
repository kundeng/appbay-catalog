name: plandex
description: AI coding agent for complex tasks — plans, implements, and iterates across files
version: latest
category: devtools
tags: [ai, coding, agent, developer-tools]
source:
  type: git
  url: https://github.com/plandex-ai/plandex
  ref: main
readiness: augmented
required_inputs:
  - name: PLANDEX_HOST
    description: Hostname for Plandex server
    type: string
    default: "plandex.${{project.DOMAIN}}"
traits_summary:
  - "ingress: internal HTTPS on port 8080"
  - "backup: daily (project data + postgres)"
  - "overlays: auto-wires Ollama via OpenAI-compatible API"
  - "note: plandex-db has hardcoded postgres password — secrets trait handles at compile time"
maintainer: appbay
