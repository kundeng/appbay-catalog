project: default
environment: default
collection: [ai-stack]
tags:
  tier: app
  role: coding-agent

upstream:
  source: ./docker-compose.yml
  expose:
    - plandex-server

traits:
  - type: ingress
    host: "plandex.${{project.DOMAIN}}"
    port: 8080
    service: plandex-server
    exposure: external
