project: default
environment: default
collection: [monitoring]
tags:
  tier: infra
  role: uptime-monitor

upstream:
  source: ./docker-compose.yml
  expose:
    - uptime-kuma

traits:
  - type: ingress
    host: "status.${{project.DOMAIN}}"
    port: 3001
    service: uptime-kuma
    exposure: internal
