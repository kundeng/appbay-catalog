project: default
environment: default
collection: [ai, self-hosted]
tags:
  tier: app
  role: screen-parser

upstream:
  source: ./docker-compose.yml
  expose:
    - omniparser

traits:
  - type: ingress
    host: "omniparser.${{project.DOMAIN}}"
    port: 7861
    service: omniparser
    exposure: external
    tls:
      staging: false
