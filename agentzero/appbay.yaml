traits:
- type: ingress
  service: agentzero
  port: 80
- type: auth
  enabled: true
  provider: authelia
  service: agentzero
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - agentzero_data
overlays:
- when:
  - ollama
  services:
    agentzero:
      environment:
      - OLLAMA_BASE_URL=http://appbay.ollama:11434
