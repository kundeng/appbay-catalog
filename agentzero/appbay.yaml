project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - agentzero

vars:
  AGENTZERO_HOST:
    description: Hostname for agentzero
    type: string
    default: "agentzero.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "agentzero.${{project.DOMAIN}}"
    port: 3000
    service: agentzero
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: agentzero

overlays:
  - when: [ollama]
    services:
      agentzero:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
  - when: [litellm]
    services:
      agentzero:
        environment:
          - OPENAI_API_BASE=http://litellm_litellm:4000/v1
