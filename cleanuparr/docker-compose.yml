services:
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "${CLEANUPARR_HOST_PORT:-11011}:11011"
    volumes:
      - cleanuparr-config:/config
    environment:
      TZ: ${TZ:-Etc/UTC}
      PORT: 11011
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: "022"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  cleanuparr-config:
