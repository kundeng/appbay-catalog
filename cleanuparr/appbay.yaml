project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - cleanuparr

vars:
  CLEANUPARR_HOST:
    description: Hostname for cleanuparr
    type: string
    default: "cleanuparr.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "cleanuparr.${{project.DOMAIN}}"
    port: 3000
    service: cleanuparr
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: cleanuparr
