services:
  openterminal:
    image: nicepkg/open-terminal:latest
    container_name: openterminal
    ports:
      - "${OPENTERMINAL_HOST_PORT:-8000}:8000"
    environment:
      OPEN_TERMINAL_API_KEY: ${OPENTERMINAL_API_KEY:-}
      OPEN_TERMINAL_PACKAGES: ${OPENTERMINAL_PACKAGES:-}
      OPEN_TERMINAL_PIP_PACKAGES: ${OPENTERMINAL_PIP_PACKAGES:-}
      OPEN_TERMINAL_EXECUTE_TIMEOUT: ${OPENTERMINAL_EXECUTE_TIMEOUT:-30}
      OPEN_TERMINAL_ENABLE_TERMINAL: ${OPENTERMINAL_ENABLE_TERMINAL:-true}
      OPEN_TERMINAL_ENABLE_NOTEBOOKS: ${OPENTERMINAL_ENABLE_NOTEBOOKS:-true}
    volumes:
      - openterminal-workspace:/home/user
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  openterminal-workspace:
