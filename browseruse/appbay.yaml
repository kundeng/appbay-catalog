traits:
- type: ingress
  service: browseruse
  port: 7788
- type: auth
  enabled: true
  provider: authelia
  service: browseruse
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - browseruse_data
overlays:
- when:
  - ollama
  services:
    browseruse:
      environment:
      - OLLAMA_BASE_URL=http://appbay.ollama:11434
