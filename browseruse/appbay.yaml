project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - browseruse

vars:
  BROWSERUSE_HOST:
    description: Hostname for browseruse
    type: string
    default: "browseruse.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "browseruse.${{project.DOMAIN}}"
    port: 3000
    service: browseruse
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: browseruse

overlays:
  - when: [ollama]
    services:
      browseruse:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
  - when: [litellm]
    services:
      browseruse:
        environment:
          - OPENAI_API_BASE=http://litellm_litellm:4000/v1
