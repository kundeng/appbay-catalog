project: default
environment: default
collection: [media]
tags:
  tier: app
  role: tv-management

upstream:
  source: ./docker-compose.yml
  expose:
    - sonarr

vars:
  SONARR_HOST:
    description: Hostname for Sonarr
    type: string
    default: "sonarr.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "sonarr.${{project.DOMAIN}}"
    port: 8989
    service: sonarr
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: sonarr
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - sonarr-config
