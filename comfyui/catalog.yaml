name: comfyui
description: Node-based Stable Diffusion workflow editor for AI image generation
version: latest
category: ai
tags: [ai, image-generation, stable-diffusion, gpu, creative]
source:
  type: git
  url: https://github.com/ai-dock/comfyui
  ref: main
readiness: augmented
required_inputs:
  - name: COMFYUI_HOST
    description: Hostname for ComfyUI
    type: string
    default: "comfyui.${{project.DOMAIN}}"
  - name: HF_TOKEN
    description: HuggingFace token for gated models (optional)
    type: secret
traits_summary:
  - "ingress: internal HTTPS on port 8188"
  - "auth: Authelia forward-auth"
  - "gpu: nvidia (required)"
  - "backup: weekly (workspace with models + workflows)"
maintainer: appbay
