traits:
- type: ingress
  service: comfyui
  port: 8188
- type: auth
  enabled: true
  provider: authelia
  service: comfyui
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - comfyui_workspace
overlays:
- when:
  - ollama
  services:
    comfyui:
      environment:
      - OLLAMA_BASE_URL=http://appbay.ollama:11434
