project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - sqlchat

vars:
  SQLCHAT_HOST:
    description: Hostname for sqlchat
    type: string
    default: "sqlchat.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "sqlchat.${{project.DOMAIN}}"
    port: 3000
    service: sqlchat
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: sqlchat

overlays:
  - when: [ollama]
    services:
      sqlchat:
        environment:
          - OLLAMA_INTERNAL_URL=http://appbay.ollama:11434
