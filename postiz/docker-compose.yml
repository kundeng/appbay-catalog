services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    ports:
      - "${POSTIZ_PORT:-5000}:5000"
    environment:
      MAIN_URL: http://localhost:${POSTIZ_PORT:-5000}
      FRONTEND_URL: http://localhost:${POSTIZ_PORT:-5000}
      NEXT_PUBLIC_BACKEND_URL: http://localhost:${POSTIZ_PORT:-5000}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://${POSTIZ_DB_USER:-postiz}:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/${POSTIZ_DB_NAME:-postiz}
      REDIS_URL: redis://postiz-redis:6379
      TEMPORAL_ADDRESS: postiz-temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      RUN_CRON: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: "false"
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      postiz-temporal:
        condition: service_started

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    environment:
      POSTGRES_USER: ${POSTIZ_DB_USER:-postiz}
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
      POSTGRES_DB: ${POSTIZ_DB_NAME:-postiz}
    volumes:
      - postiz-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTIZ_DB_USER:-postiz} -d ${POSTIZ_DB_NAME:-postiz}"]
      interval: 10s
      timeout: 3s
      retries: 3

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis:/data

  postiz-temporal-postgres:
    image: postgres:16
    container_name: postiz-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - postiz-temporal-db:/var/lib/postgresql/data

  postiz-elasticsearch:
    image: elasticsearch:7.17.18
    container_name: postiz-elasticsearch
    user: "1000:1000"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - postiz-elasticsearch-data:/usr/share/elasticsearch/data

  postiz-temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: postiz-temporal
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postiz-temporal-postgres
      TEMPORAL_NAMESPACE: default
      ENABLE_ES: "true"
      ES_SEEDS: postiz-elasticsearch
      ES_VERSION: v7
      ES_SCHEME: http
      ES_PORT: "9200"
      ES_VIS_DOCSTORE_INDEX: temporal_visibility_v1_dev
    depends_on:
      - postiz-temporal-postgres
      - postiz-elasticsearch

volumes:
  postiz-config:
  postiz-uploads:
  postiz-db:
  postiz-redis:
  postiz-temporal-db:
  postiz-elasticsearch-data:
