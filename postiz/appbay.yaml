project: default
environment: default
collection: [productivity, self-hosted]
tags:
  tier: app
  role: social-media-scheduler

upstream:
  source: ./docker-compose.yml
  expose:
    - postiz

vars:
  POSTIZ_HOST:
    description: Hostname for Postiz
    type: string
    default: "postiz.${{project.DOMAIN}}"
  POSTIZ_JWT_SECRET:
    description: JWT signing secret
    type: secret
    auto_generate: true
  POSTIZ_DB_PASSWORD:
    description: PostgreSQL password
    type: secret
    auto_generate: true

traits:
  - type: ingress
    host: "postiz.${{project.DOMAIN}}"
    port: 5000
    service: postiz
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: postiz
  - type: secrets
    provider: vault
    refs:
      POSTIZ_JWT_SECRET: vault://postiz/POSTIZ_JWT_SECRET?gen=password:32
      POSTIZ_DB_PASSWORD: vault://postiz/POSTIZ_DB_PASSWORD?gen=password:24
    injection: runtime-env
  - type: backup
    schedule: "0 2 * * *"
    retention: 14
    volumes:
      - postiz-postgres
