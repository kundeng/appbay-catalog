project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: chat-ui

upstream:
  source: ./docker-compose.yml
  expose:
    - librechat

vars:
  LIBRECHAT_HOST:
    description: Hostname for the LibreChat web UI
    type: string
    default: "librechat.${{project.DOMAIN}}"
  OPENAI_API_KEY:
    description: OpenAI API key (optional — can use Ollama instead)
    type: secret
  ANTHROPIC_API_KEY:
    description: Anthropic API key (optional)
    type: secret

traits:
  - type: ingress
    host: "librechat.${{project.DOMAIN}}"
    port: 3080
    service: librechat
    exposure: external
    tls:
      staging: false
  - type: auth
    enabled: true
    provider: authelia
    service: librechat
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - librechat_db
      - librechat_vectordb

overlays:
  - when: [ollama]
    services:
      librechat-rag:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
