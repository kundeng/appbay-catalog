project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - chatui

vars:
  CHATUI_HOST:
    description: Hostname for chatui
    type: string
    default: "chatui.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "chatui.${{project.DOMAIN}}"
    port: 3000
    service: chatui
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: chatui

overlays:
  - when: [ollama]
    services:
      chatui:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
