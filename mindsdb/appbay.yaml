project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: ai-database

upstream:
  source: ./docker-compose.yml
  expose:
    - mindsdb

vars:
  MINDSDB_HOST:
    description: Hostname for MindsDB
    type: string
    default: "mindsdb.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "mindsdb.${{project.DOMAIN}}"
    port: 47334
    service: mindsdb
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: mindsdb
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - mindsdb_data
