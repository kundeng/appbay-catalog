name: mindsdb
description: AI-powered database — query ML models with SQL, connect to any data source
version: latest
category: ai
tags: [ai, database, ml, sql, predictions]
source:
  type: git
  url: https://github.com/mindsdb/mindsdb
  ref: main
readiness: augmented
required_inputs:
  - name: MINDSDB_HOST
    description: Hostname for MindsDB
    type: string
    default: "mindsdb.${{project.DOMAIN}}"
traits_summary:
  - "ingress: internal HTTPS on port 47334"
  - "auth: Authelia forward-auth"
  - "backup: daily (model + config data)"
maintainer: appbay
