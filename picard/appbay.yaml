project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - picard

vars:
  PICARD_HOST:
    description: Hostname for picard
    type: string
    default: "picard.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "picard.${{project.DOMAIN}}"
    port: 5800
    service: picard
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: picard
