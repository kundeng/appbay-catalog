project: default
environment: default
collection:
- media
tags:
  tier: app
  role: music-tagger
upstream:
  source: ./docker-compose.yml
  expose:
  - picard
traits:
- type: ingress
  host: picard.${{project.DOMAIN}}
  port: 5800
  service: picard
  exposure: internal
- type: auth
  enabled: true
  provider: authelia
  service: picard
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - picard-config
