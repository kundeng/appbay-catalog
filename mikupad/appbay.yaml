project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - mikupad

vars:
  MIKUPAD_HOST:
    description: Hostname for mikupad
    type: string
    default: "mikupad.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "mikupad.${{project.DOMAIN}}"
    port: 4000
    service: mikupad
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: mikupad
