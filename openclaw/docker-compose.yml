services:
  openclaw:
    image: openclaw:latest
    container_name: openclaw
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-0.0.0.0}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_PORT:-8300}
      OPENCLAW_BRIDGE_PORT: ${OPENCLAW_BRIDGE_PORT:-8301}
    ports:
      - "${OPENCLAW_PORT:-8300}:${OPENCLAW_PORT:-8300}"
      - "${OPENCLAW_BRIDGE_PORT:-8301}:${OPENCLAW_BRIDGE_PORT:-8301}"
    volumes:
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/openclaw
    init: true
    stdin_open: true
    tty: true

volumes:
  openclaw-config:
  openclaw-workspace:
