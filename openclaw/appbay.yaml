project: default
environment: default
collection: [ai, self-hosted]
tags:
  tier: app
  role: coding-assistant

upstream:
  source: ./docker-compose.yml
  expose:
    - openclaw

traits:
  - type: ingress
    host: "openclaw.${{project.DOMAIN}}"
    port: 8080
    service: openclaw
    exposure: external
    tls:
      staging: false
