project: default
environment: default
collection: [admin, self-hosted]
tags:
  tier: infra
  role: container-management

upstream:
  source: ./docker-compose.yml
  expose:
    - portainer

traits:
  - type: ingress
    host: "portainer.${{project.DOMAIN}}"
    port: 9000
    service: portainer
    exposure: external
    tls:
      staging: false
