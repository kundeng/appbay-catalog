project: default
environment: default
collection: [admin, self-hosted]
tags:
  tier: infra
  role: container-management

upstream:
  source: ./docker-compose.yml
  expose:
    - portainer

vars:
  PORTAINER_HOST:
    description: Hostname for the Portainer web UI
    type: string
    default: "portainer.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "portainer.${{project.DOMAIN}}"
    port: 9000
    service: portainer
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: portainer
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - portainer_data
