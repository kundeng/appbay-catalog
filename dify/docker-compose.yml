services:
  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify-api
    environment:
      MODE: api
    depends_on:
      - dify-db
      - dify-redis
    volumes:
      - dify_storage:/app/api/storage

  dify-worker:
    image: langgenius/dify-api:latest
    container_name: dify-worker
    environment:
      MODE: worker
    depends_on:
      - dify-db
      - dify-redis
    volumes:
      - dify_storage:/app/api/storage

  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify-web

  dify-db:
    image: postgres:15-alpine
    container_name: dify-db
    environment:
      POSTGRES_USER: ${DIFY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DIFY_DB_PASSWORD:-difyai123456}
      POSTGRES_DB: ${DIFY_DB_NAME:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dify_db:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 1s
      timeout: 3s
      retries: 30

  dify-redis:
    image: redis:6-alpine
    container_name: dify-redis
    volumes:
      - dify_redis:/data
    command: redis-server --requirepass ${DIFY_REDIS_PASSWORD:-difyai123456}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s

  dify-sandbox:
    image: langgenius/dify-sandbox:latest
    container_name: dify-sandbox
    volumes:
      - dify_sandbox_deps:/dependencies

  dify:
    image: nginx:latest
    container_name: dify
    depends_on:
      - dify-api
      - dify-web
    ports:
      - ${DIFY_PORT:-80}:80

volumes:
  dify_storage:
  dify_db:
  dify_redis:
  dify_sandbox_deps:
