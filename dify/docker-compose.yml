services:
  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify-api
    environment:
      MODE: api
      DB_USERNAME: ${DIFY_DB_USER:-postgres}
      DB_PASSWORD: ${DIFY_DB_PASSWORD:-difyai123456}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${DIFY_DB_NAME:-dify}
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD:-difyai123456}@dify-redis:6379/1
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      SSRF_PROXY_HTTP_URL: http://dify-ssrf:3128
      SSRF_PROXY_HTTPS_URL: http://dify-ssrf:3128
    depends_on:
      - dify-db
      - dify-redis
    volumes:
      - dify_storage:/app/api/storage

  dify-worker:
    image: langgenius/dify-api:latest
    container_name: dify-worker
    environment:
      MODE: worker
      DB_USERNAME: ${DIFY_DB_USER:-postgres}
      DB_PASSWORD: ${DIFY_DB_PASSWORD:-difyai123456}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${DIFY_DB_NAME:-dify}
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD:-difyai123456}@dify-redis:6379/1
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
    depends_on:
      - dify-db
      - dify-redis
    volumes:
      - dify_storage:/app/api/storage

  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify-web

  dify-db:
    image: postgres:15-alpine
    container_name: dify-db
    environment:
      POSTGRES_USER: ${DIFY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DIFY_DB_PASSWORD:-difyai123456}
      POSTGRES_DB: ${DIFY_DB_NAME:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dify_db:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 1s
      timeout: 3s
      retries: 30

  dify-redis:
    image: redis:6-alpine
    container_name: dify-redis
    volumes:
      - dify_redis:/data
    command: redis-server --requirepass ${DIFY_REDIS_PASSWORD:-difyai123456}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s

  dify-sandbox:
    image: langgenius/dify-sandbox:latest
    container_name: dify-sandbox
    volumes:
      - dify_sandbox:/dependencies

  dify:
    image: nginx:latest
    container_name: dify
    depends_on:
      - dify-api
      - dify-web
    ports:
      - ${DIFY_PORT:-3000}:80

volumes:
  dify_storage:
  dify_db:
  dify_redis:
  dify_sandbox:
