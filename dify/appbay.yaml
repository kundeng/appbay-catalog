project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: llm-platform

upstream:
  source: ./docker-compose.yml
  services:
    exclude:
      - nginx
      - certbot
      - db_mysql
      - oceanbase
      - seekdb
      - qdrant
      - couchbase-server
      - pgvector
      - vastbase
      - pgvecto-rs
      - chroma
      - iris
      - oracle
      - etcd
      - minio
      - milvus-standalone
      - opensearch
      - opensearch-dashboards
      - opengauss
      - unstructured
      - myscale
      - matrixone
      - elasticsearch
      - kibana
      - milvus
      - ssrf_proxy_network
      - opensearch-net
      - oradata
      - dify_es01_data
  expose:
    - api
    - web

traits:
  - type: ingress
    host: "dify.${{project.DOMAIN}}"
    port: 3000
    service: web
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: web
  - type: secrets
    provider: vault
    refs:
      SECRET_KEY: vault://dify/SECRET_KEY?gen=password:32
      DB_PASSWORD: vault://dify/DB_PASSWORD?gen=password:24
      REDIS_PASSWORD: vault://dify/REDIS_PASSWORD?gen=password:24
      SANDBOX_API_KEY: vault://dify/SANDBOX_API_KEY?gen=password:24
    injection: runtime-env
  - type: backup
    schedule: "0 2 * * *"
    retention: 14
    volumes:
      - dify_db_postgres
      - dify_storage

overrides:
  web:
    ports:
      - "${DIFY_HOST_PORT:-3000}:3000"

overlays:
  - when: [ollama]
    services:
      api:
        environment:
          - OPENAI_API_BASE=http://appbay.ollama:11434/v1
      worker:
        environment:
          - OPENAI_API_BASE=http://appbay.ollama:11434/v1

  - when: [litellm]
    services:
      api:
        environment:
          - OPENAI_API_BASE=http://appbay.litellm:4000/v1
      worker:
        environment:
          - OPENAI_API_BASE=http://appbay.litellm:4000/v1
