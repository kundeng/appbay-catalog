name: aphrodite
description: OpenAI-compatible LLM inference engine optimized for throughput and low latency
version: latest
category: ai
tags:
  - inference
  - llm
  - openai-compatible
source:
  type: git
  url: https://github.com/PygmalionAI/aphrodite-engine
readiness: augmented
required_inputs:
  - name: HF_TOKEN
    description: Hugging Face access token, for gated or private model downloads.
    type: secret
  - name: APHRODITE_MODEL
    description: Model repo to serve, e.g. meta-llama/Llama-3-8B-Instruct.
    type: string
traits_summary:
  - ingress (API on port 2242)
maintainer: appbay
