project: default
environment: default
collection: [ai-stack, gpu-apps]
tags:
  tier: compute
  role: llm-inference

upstream:
  source: ./docker-compose.yml
  expose:
    - llamacpp

vars:
  LLAMACPP_MODEL:
    description: Path to GGUF model file in /models volume
    type: string
    default: /models/model.gguf
  LLAMACPP_CTX_SIZE:
    description: Context window size
    type: string
    default: "4096"

traits:
  - type: gpu
    # "gpu: nvidia (optional — runs on CPU too)" per this entry's own catalog.yaml,
    # so it opts out of the default refuse-without-a-GPU behaviour.
    required: false
    variant: nvidia
