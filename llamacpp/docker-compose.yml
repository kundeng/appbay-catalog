services:
  llamacpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: llamacpp
    restart: unless-stopped
    ports:
      - "${LLAMACPP_PORT:-8080}:8080"
    volumes:
      - llamacpp_models:/app/models
      - llamacpp_cache:/root/.cache/llama.cpp
    command: >
      --port 8080
      --host 0.0.0.0

volumes:
  llamacpp_models:
  llamacpp_cache:
