name: llamacpp
description: CPU/GPU LLM inference server for GGUF models with OpenAI-compatible API
version: latest
category: ai
tags: [ai, llm, inference, gguf, cpu, gpu]
source:
  type: git
  url: https://github.com/ggerganov/llama.cpp
  ref: master
readiness: augmented
required_inputs:
  - name: LLAMACPP_MODEL
    description: Path to GGUF model file
    type: string
    default: /models/model.gguf
traits_summary:
  - "no ingress — internal API service"
  - "gpu: nvidia (optional — runs on CPU too)"
  - "exposed on shared network for OpenAI-compatible API"
  - "no auth, no secrets"
maintainer: appbay
