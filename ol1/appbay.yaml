project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - ol1

vars:
  OL1_HOST:
    description: Hostname for ol1
    type: string
    default: "ol1.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "ol1.${{project.DOMAIN}}"
    port: 3000
    service: ol1
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: ol1
