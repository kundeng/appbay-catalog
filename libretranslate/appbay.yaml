project: default
environment: default
collection: [ai, self-hosted]
tags:
  tier: app
  role: translation-api

upstream:
  source: ./docker-compose.yml
  expose:
    - libretranslate

vars:
  LIBRETRANSLATE_HOST:
    description: Hostname for LibreTranslate
    type: string
    default: "translate.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "translate.${{project.DOMAIN}}"
    port: 5000
    service: libretranslate
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: libretranslate
