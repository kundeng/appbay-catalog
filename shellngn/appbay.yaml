project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - shellngn

vars:
  SHELLNGN_HOST:
    description: Hostname for shellngn
    type: string
    default: "shellngn.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "shellngn.${{project.DOMAIN}}"
    port: 4200
    service: shellngn
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: shellngn
