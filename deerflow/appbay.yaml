project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - deerflow

vars:
  DEERFLOW_HOST:
    description: Hostname for deerflow
    type: string
    default: "deerflow.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "deerflow.${{project.DOMAIN}}"
    port: 3000
    service: deerflow
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: deerflow

overlays:
  - when: [ollama]
    services:
      deerflow:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
  - when: [litellm]
    services:
      deerflow:
        environment:
          - OPENAI_API_BASE=http://litellm_litellm:4000/v1
