project: default
environment: default
collection: [ai, self-hosted]
tags:
  tier: infra
  role: inference-server

upstream:
  source: ./docker-compose.yml
  expose:
    - nexa

traits:
  - type: ingress
    host: "nexa.${{project.DOMAIN}}"
    port: 8000
    service: nexa
    exposure: external
    tls:
      staging: false
