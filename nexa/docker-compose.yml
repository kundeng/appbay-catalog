services:
  nexa:
    image: nexaai/nexa-sdk:latest
    container_name: nexa
    command: >
      server
      --host 0.0.0.0
      --port 8000
      ${NEXA_MODEL}
    ports:
      - "${NEXA_PORT:-8000}:8000"
    volumes:
      - nexa-cache:/root/.cache/nexa
      - nexa-hf-cache:/root/.cache/huggingface

volumes:
  nexa-cache:
  nexa-hf-cache:
