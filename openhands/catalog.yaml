name: openhands
description: AI software development agent — autonomous coding, debugging, and deployment
version: latest
category: devtools
tags: [ai, coding, agent, autonomous, developer-tools]
source:
  type: git
  url: https://github.com/All-Hands-AI/OpenHands
  ref: main
readiness: augmented
required_inputs:
  - name: OPENHANDS_HOST
    description: Hostname for OpenHands
    type: string
    default: "openhands.${{project.DOMAIN}}"
traits_summary:
  - "ingress: internal HTTPS on port 3000"
  - "auth: Authelia forward-auth"
  - "backup: weekly (agent state)"
  - "overlays: auto-wires Ollama"
  - "WARNING: mounts Docker socket (runs sandboxed containers)"
maintainer: appbay
