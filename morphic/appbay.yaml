project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: ai-search

upstream:
  source: ./docker-compose.yml
  expose:
    - morphic

vars:
  MORPHIC_HOST:
    description: Hostname for Morphic
    type: string
    default: "morphic.${{project.DOMAIN}}"
  OPENAI_API_KEY:
    description: OpenAI API key (or use LiteLLM proxy)
    type: secret

traits:
  - type: ingress
    host: "morphic.${{project.DOMAIN}}"
    port: 3000
    service: morphic
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: morphic

overlays:
  - when: [searxng]
    services:
      morphic:
        environment:
          - SEARXNG_API_URL=http://appbay.searxng:8080
  - when: [litellm]
    services:
      morphic:
        environment:
          - OPENAI_API_BASE=http://appbay.litellm:4000/v1
  - when: [ollama]
    services:
      morphic:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
