name: photoprism
description: AI-powered photo management app with face recognition, object detection, and geotagging
version: latest
category: media
tags: [media, image-gen, tools]
source:
  type: git
  url: https://github.com/photoprism/photoprism
readiness: raw
required_inputs:
  - name: PHOTOPRISM_ADMIN_USER
    description: Admin username
    type: string
    default: admin
  - name: PHOTOPRISM_ADMIN_PASSWORD
    description: Admin password
    type: secret
    auto_generate: true
  - name: PHOTOPRISM_DB_PASSWORD
    description: MariaDB password
    type: secret
    auto_generate: true
  - name: PHOTOPRISM_DB_ROOT_PASSWORD
    description: MariaDB root password
    type: secret
    auto_generate: true
traits_summary:
  - "ingress: external HTTPS"
  - "secrets: 3 auto-generated (admin, DB, DB root passwords)"
maintainer: appbay
