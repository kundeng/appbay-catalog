services:
  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    stop_grace_period: 15s
    depends_on:
      photoprism-db:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    ports:
      - "${PHOTOPRISM_PORT:-2342}:2342"
    environment:
      PHOTOPRISM_ADMIN_USER: ${PHOTOPRISM_ADMIN_USER:-admin}
      PHOTOPRISM_ADMIN_PASSWORD: ${PHOTOPRISM_ADMIN_PASSWORD}
      PHOTOPRISM_SITE_URL: http://localhost:${PHOTOPRISM_PORT:-2342}/
      PHOTOPRISM_SITE_TITLE: ${PHOTOPRISM_SITE_TITLE:-PhotoPrism}
      PHOTOPRISM_DATABASE_SERVER: photoprism-db:3306
      PHOTOPRISM_DATABASE_NAME: ${PHOTOPRISM_DB_NAME:-photoprism}
      PHOTOPRISM_DATABASE_USER: ${PHOTOPRISM_DB_USER:-photoprism}
      PHOTOPRISM_DATABASE_PASSWORD: ${PHOTOPRISM_DB_PASSWORD}
      PHOTOPRISM_INIT: https tensorflow
    working_dir: /photoprism
    volumes:
      - photoprism-originals:/photoprism/originals
      - photoprism-storage:/photoprism/storage

  photoprism-db:
    image: mariadb:11
    container_name: photoprism-db
    stop_grace_period: 15s
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command: >-
      --innodb-buffer-pool-size=512M
      --transaction-isolation=READ-COMMITTED
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=512
      --innodb-rollback-on-timeout=OFF
      --innodb-lock-wait-timeout=120
    environment:
      MARIADB_DATABASE: ${PHOTOPRISM_DB_NAME:-photoprism}
      MARIADB_USER: ${PHOTOPRISM_DB_USER:-photoprism}
      MARIADB_PASSWORD: ${PHOTOPRISM_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${PHOTOPRISM_DB_ROOT_PASSWORD}
    volumes:
      - photoprism-db:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'healthcheck.sh --connect --innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  photoprism-originals:
  photoprism-storage:
  photoprism-db:
