project: default
environment: default
collection: [media, self-hosted]
tags:
  tier: app
  role: photo-management

upstream:
  source: ./docker-compose.yml
  expose:
    - photoprism

vars:
  PHOTOPRISM_HOST:
    description: Hostname for the PhotoPrism web UI
    type: string
    default: "photos.${{project.DOMAIN}}"
  PHOTOPRISM_SITE_TITLE:
    description: Site title shown in the UI
    type: string
    default: PhotoPrism
  PHOTOPRISM_ADMIN_USER:
    description: Admin username
    type: string
    default: admin
  PHOTOPRISM_ADMIN_PASSWORD:
    description: Admin password
    type: secret
    auto_generate: true
  PHOTOPRISM_DB_PASSWORD:
    description: MariaDB password
    type: secret
    auto_generate: true
  PHOTOPRISM_DB_ROOT_PASSWORD:
    description: MariaDB root password
    type: secret
    auto_generate: true

traits:
  - type: ingress
    host: "photos.${{project.DOMAIN}}"
    port: 2342
    service: photoprism
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: photoprism
  - type: secrets
    provider: vault
    refs:
      PHOTOPRISM_ADMIN_PASSWORD: vault://photoprism/PHOTOPRISM_ADMIN_PASSWORD?gen=password:24
      PHOTOPRISM_DB_PASSWORD: vault://photoprism/PHOTOPRISM_DB_PASSWORD?gen=password:24
      PHOTOPRISM_DB_ROOT_PASSWORD: vault://photoprism/PHOTOPRISM_DB_ROOT_PASSWORD?gen=password:24
    injection: runtime-env
  - type: backup
    schedule: "0 2 * * *"
    retention: 14
    volumes:
      - photoprism-originals
      - photoprism-storage
      - photoprism-db

overlays:
  - when: [ollama]
    services:
      photoprism:
        environment:
          - OLLAMA_INTERNAL_URL=http://appbay.ollama:11434
