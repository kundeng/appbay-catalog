name: bazarr
description: Automatic subtitle downloading for Sonarr and Radarr
version: latest
category: media
tags: [subtitles,media,automation]
source:
  type: git
  url: https://github.com/morpheus65535/bazarr
  ref: main
readiness: augmented
required_inputs:
  - name: BAZARR_HOST
    description: Hostname for Bazarr
    type: string
    default: "bazarr.${{project.DOMAIN}}"
traits_summary:
  - "ingress: internal HTTPS"
  - "auth: Authelia forward-auth"
  - "backup: daily (config)"
  - "no secrets — built-in auth"
maintainer: appbay
