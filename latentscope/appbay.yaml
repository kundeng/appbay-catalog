project: default
environment: default
collection:
- ai
- self-hosted
tags:
  tier: app
  role: embedding-explorer
upstream:
  source: ./docker-compose.yml
  expose:
  - latentscope
traits:
- type: ingress
  host: latentscope.${{project.DOMAIN}}
  port: 5001
  service: latentscope
  exposure: external
  tls:
    staging: false
- type: auth
  enabled: true
  provider: authelia
  service: latentscope
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - latentscope_hf_cache
  - latentscope_data
overlays:
- when:
  - ollama
  services:
    latentscope:
      environment:
      - OLLAMA_BASE_URL=http://appbay.ollama:11434
