project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - cloud-commander

vars:
  CLOUD-COMMANDER_HOST:
    description: Hostname for cloud-commander
    type: string
    default: "cloud-commander.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "cloud-commander.${{project.DOMAIN}}"
    port: 8000
    service: cloud-commander
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: cloud-commander
