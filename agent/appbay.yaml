project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - agent

vars:
  AGENT_HOST:
    description: Hostname for agent
    type: string
    default: "agent.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "agent.${{project.DOMAIN}}"
    port: 3000
    service: agent
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: agent

overlays:
  - when: [ollama]
    services:
      agent:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
