traits:
- type: ingress
  service: agent
  port: 8000
- type: auth
  enabled: true
  provider: authelia
  service: agent
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - agent_data
overlays:
- when:
  - ollama
  services:
    agent:
      environment:
      - OLLAMA_BASE_URL=http://appbay.ollama:11434
