project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - maintainerr

vars:
  MAINTAINERR_HOST:
    description: Hostname for maintainerr
    type: string
    default: "maintainerr.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "maintainerr.${{project.DOMAIN}}"
    port: 6246
    service: maintainerr
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: maintainerr
