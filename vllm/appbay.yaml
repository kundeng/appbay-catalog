project: default
environment: default
collection: [ai-stack, gpu-apps]
tags:
  tier: compute
  role: llm-inference

upstream:
  source: ./docker-compose.yml
  expose:
    - vllm

vars:
  HF_TOKEN:
    description: HuggingFace token for gated models (optional)
    type: secret
  VLLM_MODEL:
    description: Model to serve (HuggingFace model ID)
    type: string
    default: meta-llama/Llama-3.1-8B-Instruct

traits:
  - type: gpu
    variant: nvidia
