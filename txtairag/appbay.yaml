project: default
environment: default
collection:
- ai-stack
tags:
  tier: app
  role: rag-search
upstream:
  source: ./docker-compose.yml
  expose:
  - txtairag
traits:
- type: ingress
  host: txtairag.${{project.DOMAIN}}
  port: 8501
  service: txtairag
  exposure: external
- type: auth
  enabled: true
  provider: authelia
  service: txtairag
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - txtairag-hf-cache
  - txtairag-data
overlays:
- when:
  - ollama
  services:
    txtairag:
      environment:
      - OLLAMA_BASE_URL=http://appbay.ollama:11434
