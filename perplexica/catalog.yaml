name: perplexica
description: AI-powered search engine with real-time web search and LLM summarization
version: latest
category: ai
tags: [ai, search, llm, rag, perplexity-alternative]
source:
  type: git
  url: https://github.com/ItzCrazyKns/Perplexica
  ref: master
readiness: augmented
required_inputs:
  - name: PERPLEXICA_HOST
    description: Hostname for the Perplexica web UI
    type: string
    default: "perplexica.${{project.DOMAIN}}"
traits_summary:
  - "ingress: external HTTPS on port 3000"
  - "auth: Authelia forward-auth"
  - "backup: daily (backend data)"
  - "overlays: auto-wires Ollama + SearXNG"
maintainer: appbay
