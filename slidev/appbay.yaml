project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - slidev

vars:
  SLIDEV_HOST:
    description: Hostname for slidev
    type: string
    default: "slidev.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "slidev.${{project.DOMAIN}}"
    port: 3030
    service: slidev
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: slidev
