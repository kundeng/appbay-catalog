name: drawio
description: AI-powered diagram editor — generates and edits diagrams from natural language
version: latest
category: productivity
tags: [diagrams, ai, tools, productivity]
source:
  type: git
  url: https://github.com/dayuanjiang/next-ai-draw-io
  ref: main
readiness: augmented
required_inputs:
  - name: DRAWIO_HOST
    description: Hostname for the editor
    type: string
    default: "drawio.${{project.DOMAIN}}"
  - name: DRAWIO_AI_PROVIDER
    description: AI provider
    type: string
    default: openai
  - name: OPENAI_API_KEY
    description: OpenAI API key (optional)
    type: secret
    default: ""
traits_summary:
  - "ingress: internal HTTPS on port 3000"
  - "auth: Authelia forward-auth"
  - "overlays: auto-wires LiteLLM as OpenAI-compatible backend"
  - "stateless — no backup needed"
maintainer: appbay
