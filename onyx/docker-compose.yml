services:
  onyx:
    image: nginx:1.25.5-alpine
    container_name: onyx
    environment:
      ONYX_BACKEND_API_HOST: onyx-api
      ONYX_WEB_SERVER_HOST: onyx-web
    depends_on:
      - onyx-api
      - onyx-web
    ports:
      - "${ONYX_PORT:-3080}:80"
    restart: unless-stopped

  onyx-web:
    image: onyxdotapp/onyx-web-server:latest
    container_name: onyx-web
    environment:
      INTERNAL_URL: http://onyx-api:8080
      NEXT_PUBLIC_DISABLE_STREAMING: ${ONYX_DISABLE_STREAMING:-false}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - onyx-api
    restart: unless-stopped

  onyx-api:
    image: onyxdotapp/onyx-backend:latest
    container_name: onyx-api
    command: >
      /bin/sh -c "
      alembic upgrade head &&
      echo 'Starting Onyx API Server' &&
      uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
    environment:
      AUTH_TYPE: ${ONYX_AUTH_TYPE:-disabled}
      POSTGRES_HOST: onyx-db
      POSTGRES_USER: ${ONYX_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ONYX_DB_PASSWORD}
      POSTGRES_DB: ${ONYX_DB_NAME:-onyx}
      VESPA_HOST: onyx-index
      REDIS_HOST: onyx-cache
      MODEL_SERVER_HOST: ${ONYX_MODEL_SERVER_HOST:-}
      MODEL_SERVER_PORT: ${ONYX_MODEL_SERVER_PORT:-11434}
      DISABLE_MODEL_SERVER: ${ONYX_DISABLE_MODEL_SERVER:-true}
      S3_ENDPOINT_URL: http://onyx-minio:9000
      S3_AWS_ACCESS_KEY_ID: ${ONYX_MINIO_USER:-minioadmin}
      S3_AWS_SECRET_ACCESS_KEY: ${ONYX_MINIO_PASSWORD}
      DO_NOT_TRACK: "true"
      DANSWER_RUNNING_IN_DOCKER: "true"
    volumes:
      - onyx-api-logs:/var/log/onyx
    depends_on:
      onyx-db:
        condition: service_healthy
      onyx-index:
        condition: service_started
      onyx-cache:
        condition: service_started
      onyx-minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  onyx-background:
    image: onyxdotapp/onyx-backend:latest
    container_name: onyx-background
    command: >
      /bin/sh -c "/app/scripts/supervisord_entrypoint.sh"
    environment:
      USE_LIGHTWEIGHT_BACKGROUND_WORKER: "true"
      AUTH_TYPE: ${ONYX_AUTH_TYPE:-disabled}
      POSTGRES_HOST: onyx-db
      POSTGRES_USER: ${ONYX_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ONYX_DB_PASSWORD}
      POSTGRES_DB: ${ONYX_DB_NAME:-onyx}
      VESPA_HOST: onyx-index
      REDIS_HOST: onyx-cache
      MODEL_SERVER_HOST: ${ONYX_MODEL_SERVER_HOST:-}
      MODEL_SERVER_PORT: ${ONYX_MODEL_SERVER_PORT:-11434}
      INDEXING_MODEL_SERVER_HOST: ${ONYX_MODEL_SERVER_HOST:-}
      DISABLE_MODEL_SERVER: ${ONYX_DISABLE_MODEL_SERVER:-true}
      S3_ENDPOINT_URL: http://onyx-minio:9000
      S3_AWS_ACCESS_KEY_ID: ${ONYX_MINIO_USER:-minioadmin}
      S3_AWS_SECRET_ACCESS_KEY: ${ONYX_MINIO_PASSWORD}
      DO_NOT_TRACK: "true"
      DANSWER_RUNNING_IN_DOCKER: "true"
    volumes:
      - onyx-background-logs:/var/log/onyx
    depends_on:
      onyx-db:
        condition: service_healthy
      onyx-index:
        condition: service_started
      onyx-cache:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  onyx-db:
    image: postgres:15.2-alpine
    container_name: onyx-db
    environment:
      POSTGRES_USER: ${ONYX_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ONYX_DB_PASSWORD}
      POSTGRES_DB: ${ONYX_DB_NAME:-onyx}
    command: -c max_connections=250
    volumes:
      - onyx-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ONYX_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  onyx-cache:
    image: redis:7.4-alpine
    container_name: onyx-cache
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /data
    restart: unless-stopped

  onyx-index:
    image: vespaengine/vespa:latest
    container_name: onyx-index
    environment:
      VESPA_SKIP_UPGRADE_CHECK: "true"
    volumes:
      - onyx-vespa:/opt/vespa/var
    restart: unless-stopped

  onyx-minio:
    image: minio/minio:latest
    container_name: onyx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ONYX_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ONYX_MINIO_PASSWORD}
    volumes:
      - onyx-minio:/data
    restart: unless-stopped

volumes:
  onyx-api-logs:
  onyx-background-logs:
  onyx-db:
  onyx-vespa:
  onyx-minio:
