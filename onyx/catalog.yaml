name: onyx
description: AI-powered knowledge management with document search, chat, and connectors
version: latest
category: ai
tags: [ai, knowledge-base, search, rag, document-management]
source:
  type: git
  url: https://github.com/onyx-dot-app/onyx
  ref: main
readiness: augmented
required_inputs:
  - name: ONYX_HOST
    description: Hostname for the Onyx web UI
    type: string
    default: "onyx.${{project.DOMAIN}}"
  - name: ONYX_DB_PASSWORD
    description: PostgreSQL password
    type: secret
    auto_generate: true
  - name: ONYX_MINIO_PASSWORD
    description: MinIO password
    type: secret
    auto_generate: true
traits_summary:
  - "ingress: external HTTPS on onyx-web port 3000"
  - "auth: Authelia forward-auth"
  - "secrets: 2 auto-generated (DB, MinIO)"
  - "backup: daily (postgres, vespa, minio)"
  - "excludes: nginx front-end (Appbay handles ingress)"
  - "overlays: auto-wires Ollama as LLM backend"
maintainer: appbay
