services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    depends_on:
      - karakeep-chrome
      - karakeep-meilisearch
    ports:
      - ${KARAKEEP_PORT:-3000}:3000
    volumes:
      - karakeep_data:/data
    environment:
      - NEXTAUTH_SECRET=${KARAKEEP_NEXTAUTH_SECRET:-change_me_secret}
      - NEXTAUTH_URL=http://localhost:${KARAKEEP_PORT:-3000}
      - MEILI_ADDR=http://karakeep-meilisearch:7700
      - MEILI_MASTER_KEY=${KARAKEEP_MEILI_MASTER_KEY:-change_me_meili_key}
      - BROWSER_WEB_URL=http://karakeep-chrome:9222
      - DATA_DIR=/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  karakeep-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    container_name: karakeep-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars

  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.13.3
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${KARAKEEP_MEILI_MASTER_KEY:-change_me_meili_key}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - karakeep_meilisearch:/meili_data

volumes:
  karakeep_data:
  karakeep_meilisearch:
