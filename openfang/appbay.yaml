project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - openfang

vars:
  OPENFANG_HOST:
    description: Hostname for openfang
    type: string
    default: "openfang.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "openfang.${{project.DOMAIN}}"
    port: 3000
    service: openfang
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: openfang

overlays:
  - when: [ollama]
    services:
      openfang:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
