project: default
environment: default
collection: [automation, self-hosted]
tags:
  tier: app
  role: workflow-automation

upstream:
  source: ./docker-compose.yml
  expose:
    - activepieces

vars:
  ACTIVEPIECES_HOST:
    description: Hostname for Activepieces
    type: string
    default: "automate.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "automate.${{project.DOMAIN}}"
    port: 80
    service: activepieces
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: activepieces
  - type: secrets
    provider: vault
    refs:
      ACTIVEPIECES_PG_PASSWORD: vault://activepieces/ACTIVEPIECES_PG_PASSWORD?gen=password:24
      AP_JWT_SECRET: vault://activepieces/AP_JWT_SECRET?gen=password:32
      AP_ENCRYPTION_KEY: vault://activepieces/AP_ENCRYPTION_KEY?gen=password:32
    injection: runtime-env
  - type: backup
    schedule: "0 2 * * *"
    retention: 14
    volumes:
      - activepieces_db

overlays:
  - when: [ollama]
    services:
      activepieces:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
