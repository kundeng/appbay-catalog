name: activepieces
description: No-code workflow automation with 200+ integrations (Zapier alternative)
version: latest
category: automation
tags: [automation, workflow, no-code, integrations]
source:
  type: git
  url: https://github.com/activepieces/activepieces
  ref: main
readiness: augmented
required_inputs:
  - name: ACTIVEPIECES_HOST
    description: Hostname for Activepieces
    type: string
    default: "automate.${{project.DOMAIN}}"
  - name: ACTIVEPIECES_PG_PASSWORD
    description: PostgreSQL password
    type: secret
    auto_generate: true
  - name: AP_JWT_SECRET
    description: JWT signing secret
    type: secret
    auto_generate: true
traits_summary:
  - "ingress: external HTTPS"
  - "secrets: 2 auto-generated (DB, JWT)"
  - "backup: daily (postgres)"
  - "no auth trait — activepieces has built-in auth"
maintainer: appbay
