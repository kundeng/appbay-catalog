project: default
environment: default
collection: [automation, self-hosted]
tags:
  tier: app
  role: orchestration-platform

upstream:
  source: ./docker-compose.yml
  expose:
    - kestra

vars:
  KESTRA_HOST:
    description: Hostname for the Kestra web UI
    type: string
    default: "kestra.${{project.DOMAIN}}"
  KESTRA_DB_PASSWORD:
    description: PostgreSQL password
    type: secret
    auto_generate: true
  KESTRA_BASIC_AUTH_PASSWORD:
    description: Kestra admin password
    type: secret
    auto_generate: true

traits:
  - type: ingress
    host: "kestra.${{project.DOMAIN}}"
    port: 8080
    service: kestra
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: kestra
  - type: secrets
    provider: vault
    refs:
      KESTRA_DB_PASSWORD: vault://kestra/KESTRA_DB_PASSWORD?gen=password:24
      KESTRA_BASIC_AUTH_PASSWORD: vault://kestra/KESTRA_BASIC_AUTH_PASSWORD?gen=password:24
    injection: runtime-env
  - type: backup
    schedule: "0 2 * * *"
    retention: 14
    volumes:
      - postgres-data
      - kestra-data
