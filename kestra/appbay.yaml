project: default
environment: default
collection:
- automation
- self-hosted
tags:
  tier: app
  role: workflow-orchestration
upstream:
  source: ./docker-compose.yml
  expose:
  - kestra
traits:
- type: ingress
  host: kestra.${{project.DOMAIN}}
  port: 8080
  service: kestra
  exposure: external
  tls:
    staging: false
- type: auth
  enabled: true
  provider: authelia
  service: kestra
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - postgres-data
  - kestra-data
