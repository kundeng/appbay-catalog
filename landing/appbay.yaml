project: default
environment: default
collection: [ai, self-hosted]
tags:
  tier: app
  role: landing-page

upstream:
  source: ./docker-compose.yml
  expose:
    - landing

traits:
  - type: ingress
    host: "landing.${{project.DOMAIN}}"
    port: 80
    service: landing
    exposure: external
    tls:
      staging: false
