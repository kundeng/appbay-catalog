services:
  landing:
    image: nginx:alpine
    container_name: landing
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 3
