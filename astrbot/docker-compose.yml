services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    ports:
      - ${ASTRBOT_PORT:-6185}:6185
    volumes:
      - astrbot_data:/AstrBot/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6185/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  astrbot_data:
