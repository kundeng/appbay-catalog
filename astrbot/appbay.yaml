project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - astrbot

vars:
  ASTRBOT_HOST:
    description: Hostname for astrbot
    type: string
    default: "astrbot.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "astrbot.${{project.DOMAIN}}"
    port: 3000
    service: astrbot
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: astrbot

overlays:
  - when: [ollama]
    services:
      astrbot:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
