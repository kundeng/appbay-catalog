project: default
environment: default
collection: [ai-stack]
tags:
  tier: app
  role: llm-evaluation

upstream:
  source: ./docker-compose.yml
  expose:
    - promptfoo

traits:
  - type: ingress
    host: "promptfoo.${{project.DOMAIN}}"
    port: 3000
    service: promptfoo
    exposure: internal

overlays:
  - when: [ollama]
    services:
      promptfoo:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
