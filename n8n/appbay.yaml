project: default
environment: default
collection: [automation, self-hosted]
tags:
  tier: app
  role: workflow-automation

upstream:
  source: ./docker-compose.yml
  expose:
    - n8n

vars:
  N8N_HOST:
    description: Hostname for the n8n web UI
    type: string
    default: "n8n.${{project.DOMAIN}}"
  WEBHOOK_URL:
    description: Public URL for n8n webhooks
    type: string
    default: "https://n8n.${{project.DOMAIN}}/"
  N8N_DB_PASSWORD:
    description: PostgreSQL password
    type: secret
    auto_generate: true
  N8N_ENCRYPTION_KEY:
    description: Encryption key for stored credentials
    type: secret
    auto_generate: true

traits:
  - type: ingress
    host: "n8n.${{project.DOMAIN}}"
    port: 5678
    service: n8n
    exposure: external
    tls:
      staging: false
  - type: auth
    enabled: true
    provider: authelia
    service: n8n
  - type: backup
    schedule: "0 2 * * *"
    retention: 7
    volumes:
      - n8n-data
      - n8n-db

overlays:
  - when: [ollama]
    services:
      n8n:
        environment:
          - OLLAMA_HOST=http://appbay.ollama:11434
