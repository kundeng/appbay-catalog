project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - glances

vars:
  GLANCES_HOST:
    description: Hostname for glances
    type: string
    default: "glances.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "glances.${{project.DOMAIN}}"
    port: 61208
    service: glances
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: glances
