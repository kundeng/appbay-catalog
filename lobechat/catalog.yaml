name: lobechat
description: Modern chat UI supporting multiple LLM providers with plugin ecosystem
version: latest
category: ai
tags: [ai, llm, chat, ui]
source:
  type: git
  url: https://github.com/lobehub/lobe-chat
  ref: main
readiness: augmented
required_inputs:
  - name: LOBECHAT_HOST
    description: Hostname for the LobeChat web UI
    type: string
    default: "chat.${{project.DOMAIN}}"
traits_summary:
  - "ingress: external HTTPS on port 3210"
  - "auth: Authelia forward-auth"
  - "overlays: auto-wires Ollama as LLM backend"
  - "stateless — no backup needed, no secrets"
maintainer: appbay
