project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: chat-ui

upstream:
  source: ./docker-compose.yml
  expose:
    - lobechat

vars:
  LOBECHAT_HOST:
    description: Hostname for the LobeChat web UI
    type: string
    default: "chat.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "chat.${{project.DOMAIN}}"
    port: 3210
    service: lobechat
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: lobechat

overlays:
  - when: [ollama]
    services:
      lobechat:
        environment:
          - OLLAMA_PROXY_URL=http://appbay.ollama:11434/v1
  - when: [litellm]
    services:
      lobechat:
        environment:
          - OPENAI_PROXY_URL=http://litellm_litellm:4000/v1
