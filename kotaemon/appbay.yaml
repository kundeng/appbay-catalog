project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - kotaemon

vars:
  KOTAEMON_HOST:
    description: Hostname for kotaemon
    type: string
    default: "kotaemon.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "kotaemon.${{project.DOMAIN}}"
    port: 7860
    service: kotaemon
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: kotaemon

overlays:
  - when: [ollama]
    services:
      kotaemon:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
