project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: llm-workspace

upstream:
  source: ./docker-compose.yml
  expose:
    - anythingllm

vars:
  ANYTHINGLLM_HOST:
    description: Hostname for AnythingLLM
    type: string
    default: "anythingllm.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "anythingllm.${{project.DOMAIN}}"
    port: 3001
    service: anythingllm
    exposure: external
    tls:
      staging: false
  - type: auth
    enabled: true
    provider: authelia
    service: anythingllm
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - anythingllm_storage

overlays:
  - when: [ollama]
    services:
      anythingllm:
        environment:
          - LLM_PROVIDER=ollama
          - OLLAMA_BASE_PATH=http://appbay.ollama:11434
