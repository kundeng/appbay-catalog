name: aider
description: AI pair programming tool that edits code in your local git repo via LLM chat
version: latest
category: ai
tags:
  - coding
  - llm
  - chat
source:
  type: git
  url: https://github.com/paul-gauthier/aider
readiness: augmented
required_inputs:
  - name: ANTHROPIC_API_KEY
    description: Anthropic API key. Issued by Anthropic — appbay cannot generate it.
    type: secret
  - name: OPENAI_API_KEY
    description: OpenAI API key. Issued by OpenAI — appbay cannot generate it.
    type: secret
traits_summary:
  - ingress (web UI on port 8501)
maintainer: appbay
