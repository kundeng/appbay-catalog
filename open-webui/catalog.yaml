name: open-webui
description: Feature-rich chat UI for Ollama and OpenAI-compatible LLMs
version: latest
category: ai
tags: [ai, llm, chat, ui, ollama]
source:
  type: git
  url: https://github.com/open-webui/open-webui
  ref: main
readiness: augmented
required_inputs:
  - name: OPEN_WEBUI_HOST
    description: Hostname for Open WebUI
    type: string
    default: "chat.${{project.DOMAIN}}"
traits_summary:
  - "ingress: external HTTPS on port 8080"
  - "auth: Authelia forward-auth"
  - "backup: daily (chat data)"
  - "overlays: auto-wires Ollama"
maintainer: appbay
