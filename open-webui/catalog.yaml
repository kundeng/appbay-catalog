name: open-webui
description: ChatGPT-style web UI for local LLMs (Ollama, vLLM, OpenAI-compatible APIs)
version: latest
category: ai
tags: [ai, llm, chat, ollama, gpu]
source:
  type: git
  url: https://github.com/open-webui/open-webui
readiness: augmented
required_inputs:
  - name: WEBUI_HOST
    description: Hostname for the chat UI
    type: string
    default: "chat.${{project.DOMAIN}}"
  - name: OLLAMA_BASE_URL
    description: URL of the Ollama API (auto-configured if ollama is deployed)
    type: string
    default: "http://appbay.ollama:11434"
traits_summary:
  - "ingress: external HTTPS"
  - "auth: Authentik forward-auth"
  - "overlays: auto-configures when ollama, whisper, or searxng are active"
maintainer: appbay
