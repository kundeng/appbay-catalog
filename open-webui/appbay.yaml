project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: chat-ui

upstream:
  source: ./docker-compose.yml
  expose:
    - open-webui

vars:
  OPEN_WEBUI_HOST:
    description: Hostname for Open WebUI
    type: string
    default: "chat.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "chat.${{project.DOMAIN}}"
    port: 8080
    service: open-webui
    exposure: external
    tls:
      staging: false
  - type: auth
    enabled: true
    provider: authelia
    service: open-webui
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - open-webui-data

overlays:
  - when: [ollama]
    services:
      open-webui:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
