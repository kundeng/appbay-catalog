project: default
environment: default
collection: [ai-stack]
tags:
  tier: frontend
  role: chat-ui

upstream:
  source: ./docker-compose.yml
  expose:
    - open-webui

traits:
  - type: ingress
    host: "chat.${{project.DOMAIN}}"
    port: 8080
    service: open-webui
    exposure: both
  - type: auth
    enabled: true
    provider: authentik
    service: open-webui

overlays:
  - when: [ollama]
    services:
      open-webui:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
          - ENABLE_OLLAMA_API=true

  - when: [whisper]
    services:
      open-webui:
        environment:
          - AUDIO_STT_ENGINE=openai
          - AUDIO_STT_OPENAI_API_BASE_URL=http://whisper_whisper:8000/v1

  - when: [ollama, searxng]
    services:
      open-webui:
        environment:
          - ENABLE_RAG_WEB_SEARCH=true
          - RAG_WEB_SEARCH_ENGINE=searxng
          - SEARXNG_QUERY_URL=http://searxng_searxng:8080/search?q=<query>
