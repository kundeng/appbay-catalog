project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app
  role: chat-ui

upstream:
  source: ./docker-compose.yml
  expose:
    - open-webui

vars:
  OPEN_WEBUI_HOST:
    description: Hostname for Open WebUI
    type: string
    default: "chat.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "chat.${{project.DOMAIN}}"
    port: 8080
    service: open-webui
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: open-webui
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - open-webui-data

overlays:
  - when: [ollama]
    services:
      open-webui:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
  - when: [litellm]
    services:
      open-webui:
        environment:
          - OPENAI_API_BASE_URLS=http://litellm_litellm:4000/v1
          - ENABLE_OPENAI_API=true
  - when: [searxng]
    services:
      open-webui:
        environment:
          - ENABLE_RAG_WEB_SEARCH=true
          - RAG_WEB_SEARCH_ENGINE=searxng
          - SEARXNG_QUERY_URL=http://appbay.searxng:8080/search?q=<query>
