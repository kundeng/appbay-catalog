project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - botpress

vars:
  BOTPRESS_HOST:
    description: Hostname for botpress
    type: string
    default: "botpress.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "botpress.${{project.DOMAIN}}"
    port: 3000
    service: botpress
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: botpress

overlays:
  - when: [ollama]
    services:
      botpress:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
