services:
  botpress:
    image: botpress/server
    container_name: botpress
    restart: unless-stopped
    environment:
      BP_DATABASE_URL: ${BP_DATABASE_URL:-sqlite:./data/botpress.db}
    volumes:
      - botpress_data:/botpress/data
    ports:
      - "${BOTPRESS_PORT:-3000}:3000"

volumes:
  botpress_data:
