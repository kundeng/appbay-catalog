services:
  mkvtoolnix:
    image: jlesage/mkvtoolnix:latest
    container_name: mkvtoolnix
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "${MKVTOOLNIX_PORT:-5800}:5800"
    volumes:
      - mkvtoolnix-config:/config
      - ${DOWNLOADS_DIR:-/data/downloads}:/data/downloads
    environment:
      USER_ID: ${PUID:-1000}
      GROUP_ID: ${PGID:-1000}
      UMASK: "002"
      TZ: ${TZ:-Etc/UTC}
      KEEP_APP_RUNNING: 1
      CLEAN_TMP_DIR: 1
      DISPLAY_WIDTH: 1600
      DISPLAY_HEIGHT: 960

volumes:
  mkvtoolnix-config:
