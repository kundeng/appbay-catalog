services:
  nanobot:
    image: nanobot/nanobot:latest
    container_name: nanobot
    restart: unless-stopped
    environment:
      - TERM=xterm-256color
    ports:
      - "${NANOBOT_HOST_PORT:-18790}:18790"
    volumes:
      - nanobot_config:/root/.nanobot
    init: true
    stdin_open: true
    tty: true
    command: ["gateway"]

volumes:
  nanobot_config:
