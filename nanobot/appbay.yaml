project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - nanobot

vars:
  NANOBOT_HOST:
    description: Hostname for nanobot
    type: string
    default: "nanobot.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "nanobot.${{project.DOMAIN}}"
    port: 3000
    service: nanobot
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: nanobot

overlays:
  - when: [ollama]
    services:
      nanobot:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
