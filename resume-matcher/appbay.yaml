project: default
environment: default
collection: [ai-stack]
tags:
  tier: app
  role: resume-analysis

upstream:
  source: ./docker-compose.yml
  expose:
    - resume-matcher

traits:
  - type: ingress
    host: "resume-matcher.${{project.DOMAIN}}"
    port: 3000
    service: resume-matcher
    exposure: internal
