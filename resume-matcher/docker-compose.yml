services:
  resume-matcher:
    image: ghcr.io/srbhr/resume-matcher-frontend:latest
    container_name: resume-matcher
    ports:
      - "${RESUME_MATCHER_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://resume-matcher-backend:8000
    depends_on:
      resume-matcher-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  resume-matcher-backend:
    image: ghcr.io/srbhr/resume-matcher-backend:latest
    container_name: resume-matcher-backend
    ports:
      - "${RESUME_MATCHER_BACKEND_PORT:-8000}:8000"
    environment:
      SESSION_SECRET_KEY: ${RESUME_MATCHER_SESSION_SECRET}
      SYNC_DATABASE_URL: sqlite:///./app.db
      ASYNC_DATABASE_URL: sqlite+aiosqlite:///./app.db
      LLM_PROVIDER: ${RESUME_MATCHER_LLM_PROVIDER:-openai}
      LL_MODEL: ${RESUME_MATCHER_LLM_MODEL:-}
      EMBEDDING_PROVIDER: ${RESUME_MATCHER_EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${RESUME_MATCHER_EMBEDDING_MODEL:-}
    volumes:
      - resume-matcher-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  resume-matcher-data:
