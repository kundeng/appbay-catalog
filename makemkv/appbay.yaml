project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - makemkv

vars:
  MAKEMKV_HOST:
    description: Hostname for makemkv
    type: string
    default: "makemkv.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "makemkv.${{project.DOMAIN}}"
    port: 5800
    service: makemkv
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: makemkv
