services:
  opennotebook:
    image: lfnovo/open-notebook:latest
    container_name: opennotebook
    ports:
      - "${OPENNOTEBOOK_HOST_PORT:-8502}:8502"
      - "${OPENNOTEBOOK_API_HOST_PORT:-5055}:5055"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPEN_NOTEBOOK_PASSWORD: ${OPENNOTEBOOK_PASSWORD:-}
    volumes:
      - opennotebook-data:/app/data
      - opennotebook-db:/mydata

volumes:
  opennotebook-data:
  opennotebook-db:
