project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - opennotebook

vars:
  OPENNOTEBOOK_HOST:
    description: Hostname for opennotebook
    type: string
    default: "opennotebook.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "opennotebook.${{project.DOMAIN}}"
    port: 3000
    service: opennotebook
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: opennotebook

overlays:
  - when: [ollama]
    services:
      opennotebook:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
  - when: [litellm]
    services:
      opennotebook:
        environment:
          - OPENAI_API_BASE=http://litellm_litellm:4000/v1
