name: sabnzbd
description: Usenet binary downloader
version: latest
category: media
tags: [usenet,download,nzb]
source:
  type: git
  url: https://github.com/sabnzbd/sabnzbd
  ref: main
readiness: augmented
required_inputs:
  - name: SABNZBD_HOST
    description: Hostname for Sabnzbd
    type: string
    default: "sabnzbd.${{project.DOMAIN}}"
traits_summary:
  - "ingress: internal HTTPS"
  - "auth: Authelia forward-auth"
  - "backup: daily (config)"
  - "no secrets — built-in auth"
maintainer: appbay
