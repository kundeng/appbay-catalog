project: default
environment: default
collection:
- ai-stack
tags:
  tier: app
  role: ai-search
upstream:
  source: ./docker-compose.yml
  expose:
  - perplexideez
traits:
- type: ingress
  host: perplexideez.${{project.DOMAIN}}
  port: 80
  service: perplexideez
  exposure: external
- type: auth
  enabled: true
  provider: authelia
  service: perplexideez
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - perplexideez-pgdata
overlays:
- when:
  - ollama
  services:
    perplexideez:
      environment:
      - OLLAMA_BASE_URL=http://appbay.ollama:11434
