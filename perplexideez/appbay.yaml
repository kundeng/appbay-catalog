project: default
environment: default
collection: [ai-stack]
tags:
  tier: app
  role: ai-search

upstream:
  source: ./docker-compose.yml
  expose:
    - perplexideez

traits:
  - type: ingress
    host: "perplexideez.${{project.DOMAIN}}"
    port: 80
    service: perplexideez
    exposure: external
