services:
  sglang:
    image: lmsysorg/sglang:latest
    container_name: sglang
    ports:
      - "${SGLANG_HOST_PORT:-30000}:30000"
    volumes:
      - sglang-hf-cache:/root/.cache/huggingface
      - sglang-vllm-cache:/root/.cache/vllm
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    entrypoint: python3 -m sglang.launch_server
    command: >
      --model-path ${SGLANG_MODEL}
      --host 0.0.0.0
      --port 30000
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  sglang-hf-cache:
  sglang-vllm-cache:
