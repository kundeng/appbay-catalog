project: default
environment: default
collection: [monitoring, observability]
tags:
  tier: infra
  role: dashboards

upstream:
  source: ./docker-compose.yml
  expose:
    - grafana
    - prometheus

vars:
  GRAFANA_HOST: "grafana.${{project.DOMAIN}}"
  GF_SECURITY_ADMIN_USER: admin

traits:
  - type: ingress
    host: "grafana.${{project.DOMAIN}}"
    port: 3000
    service: grafana
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: grafana
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - grafana-data
      - prometheus-data
