project: default
environment: default
collection: [monitoring, observability]
tags:
  tier: infra
  role: dashboards

upstream:
  source: ./docker-compose.yml
  expose:
    - grafana
    - prometheus

vars:
  GRAFANA_HOST:
    description: Hostname for the Grafana web UI
    type: string
    default: "grafana.${{project.DOMAIN}}"
  GF_SECURITY_ADMIN_USER:
    description: Grafana admin username
    type: string
    default: admin
  GF_SECURITY_ADMIN_PASSWORD:
    description: Grafana admin password
    type: secret
    auto_generate: true

traits:
  - type: ingress
    host: "grafana.${{project.DOMAIN}}"
    port: 3000
    service: grafana
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: grafana
  - type: backup
    schedule: "0 3 * * *"
    retention: 14
    volumes:
      - grafana-data
      - prometheus-data
