project: default
environment: default
collection: [ai, self-hosted]
tags:
  tier: infra
  role: llm-optimizer

upstream:
  source: ./docker-compose.yml
  expose:
    - optillm

traits:
  - type: ingress
    host: "optillm.${{project.DOMAIN}}"
    port: 8000
    service: optillm
    exposure: external
    tls:
      staging: false
