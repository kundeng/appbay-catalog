project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - webtop

vars:
  WEBTOP_HOST:
    description: Hostname for webtop
    type: string
    default: "webtop.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "webtop.${{project.DOMAIN}}"
    port: 3000
    service: webtop
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: webtop
