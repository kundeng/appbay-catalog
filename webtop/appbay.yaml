project: default
environment: default
collection:
- self-hosted
tags:
  tier: app
  role: desktop-environment
upstream:
  source: ./docker-compose.yml
  expose:
  - webtop
traits:
- type: ingress
  host: desktop.${{project.DOMAIN}}
  port: 3000
  service: webtop
  exposure: external
- type: auth
  enabled: true
  provider: authelia
  service: webtop
- type: backup
  schedule: 0 3 * * *
  retention: 14
  volumes:
  - webtop-config
