project: default
environment: default
collection: [ai-stack, self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - cognee

vars:
  COGNEE_HOST:
    description: Hostname for cognee
    type: string
    default: "cognee.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "cognee.${{project.DOMAIN}}"
    port: 3000
    service: cognee
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: cognee

overlays:
  - when: [ollama]
    services:
      cognee:
        environment:
          - OLLAMA_BASE_URL=http://appbay.ollama:11434
