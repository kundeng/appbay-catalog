services:
  cognee:
    image: ghcr.io/topoteretes/cognee:latest
    container_name: cognee
    ports:
      - ${COGNEE_HOST_PORT:-8000}:8000
    environment:
      - HOST=0.0.0.0
      - ENVIRONMENT=local
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ALLOWED_ORIGINS=*
      - LLM_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${COGNEE_LLM_MODEL:-gpt-4o-mini}
      - LLM_PROVIDER=${COGNEE_LLM_PROVIDER:-openai}
      - EMBEDDING_PROVIDER=${COGNEE_EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${COGNEE_EMBEDDING_MODEL:-text-embedding-3-large}
      - DB_PROVIDER=sqlite
      - GRAPH_DATABASE_PROVIDER=kuzu
      - VECTOR_DB_PROVIDER=lancedb
      - DATA_ROOT_DIRECTORY=/app/.cognee/data
      - SYSTEM_ROOT_DIRECTORY=/app/.cognee/system
      - CACHE_ROOT_DIRECTORY=/app/.cognee/cache
      - REQUIRE_AUTHENTICATION=False
      - TELEMETRY_DISABLED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cognee_data:/app/.cognee
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  cognee_data:
