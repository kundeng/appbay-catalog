project: default
environment: default
collection: [ai-stack, observability]
tags:
  tier: infra
  role: llm-observability

upstream:
  source: ./docker-compose.yml
  expose:
    - langfuse

traits:
  - type: ingress
    host: "langfuse.${{project.DOMAIN}}"
    port: 3000
    service: langfuse
    exposure: internal
  - type: auth
    enabled: true
    provider: authentik
    service: langfuse
  - type: backup
    schedule: "0 3 * * *"
    retention: 30
    volumes:
      - langfuse_db
      - langfuse_clickhouse
      - langfuse_minio
