project: default
environment: default
collection: [self-hosted]
tags:
  tier: app

upstream:
  source: ./docker-compose.yml
  expose:
    - qrgen

vars:
  QRGEN_HOST:
    description: Hostname for qrgen
    type: string
    default: "qrgen.${{project.DOMAIN}}"

traits:
  - type: ingress
    host: "qrgen.${{project.DOMAIN}}"
    port: 3000
    service: qrgen
    exposure: internal
  - type: auth
    enabled: true
    provider: authelia
    service: qrgen
